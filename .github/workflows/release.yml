name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - name: Build
        run: |
          V="${GITHUB_REF_NAME}"
          D="Participants"
          mkdir -p "$D"
          LDF="-s -w -X main.version=${V}"
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "$LDF" -o "$D/Participants.exe" .
          GOOS=darwin  GOARCH=arm64 go build -trimpath -ldflags "$LDF" -o "$D/Participants-mac-arm64" .
          GOOS=darwin  GOARCH=amd64 go build -trimpath -ldflags "$LDF" -o "$D/Participants-mac-intel" .
          cp package/LISEZMOI.txt package/Lancer-Mac.command "$D/"
          chmod +x "$D/Participants-mac-arm64" "$D/Participants-mac-intel" "$D/Lancer-Mac.command"
          zip -r "Participants-${V}.zip" "$D"
      - uses: softprops/action-gh-release@v2
        with:
          files: Participants-*.zip
          generate_release_notes: true
